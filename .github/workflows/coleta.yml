name: coleta diária
# Recoleta todas as fontes, reconstrói o índice, comita os dados e publica em produção na Vercel.
on:
  schedule: [{ cron: "0 9 * * *" }]   # 06:00 BRT
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: coleta, cancel-in-progress: false }
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      # data/raw não vai pro git: o cache guarda a última coleta boa de cada fonte, então uma fonte que falhar hoje não some do site.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: pip install requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Coletar e construir
        run: python collectors/build.py --collect
      - name: Publicar no banco
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collectors/publicar_catalogo.py

      - name: Comitar dados
        # imoveis.json e indice.json não são versionados: o catálogo vive no banco e esses dois
        # são artefato da coleta. Vai para o git só o resumo e os arquivos que o navegador busca.
        run: |
          git config user.name "lotwise-bot" && git config user.email "bot@lotwise"
          git add web/data/meta.json
          git diff --cached --quiet || (git commit -m "coleta $(date -u +%F)" && git pull --rebase && git push)
      - name: Publicar na Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.23.2 deploy --prod --yes --token="$VERCEL_TOKEN"
