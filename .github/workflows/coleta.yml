name: coleta diária
on:
  schedule: [{ cron: "0 9 * * *" }]   # 06:00 BRT
  workflow_dispatch:
permissions: { contents: write }
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml
      - run: python collectors/build.py --collect
      - run: |
          git config user.name "garimpo-bot" && git config user.email "bot@garimpo"
          git add web/data/imoveis.json web/data/meta.json
          git diff --cached --quiet || (git commit -m "coleta $(date -u +%F)" && git push)
